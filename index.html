<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>דו־קרב</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./lev.ico">
    <style>
        :root {
            --a: #ff2d75;
            --b: #00e5ff;
            --y: #ffe600;
            --bg: #12002b
        }

        * {
            box-sizing: border-box;
            margin: 0;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: Heebo,system-ui,sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            touch-action: manipulation
        }

            body::before {
                content: "";
                position: fixed;
                inset: -50%;
                background: conic-gradient(from 0deg,#ff2d7533,#12002b,#00e5ff33,#12002b,#ffe60022,#12002b,#ff2d7533);
                animation: spin 18s linear infinite;
                z-index: -1
            }

        #cv {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            text-align: center
        }

        h1.logo {
            font-size: clamp(56px,12vw,140px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(90deg,var(--a),var(--y),var(--b));
            -webkit-background-clip: text;
            color: transparent;
            background-size: 200%;
            animation: shine 3s linear infinite,pop .8s both
        }

        h2 {
            font-size: clamp(26px,5vw,56px);
            font-weight: 900
        }

        p {
            opacity: .85;
            font-size: clamp(16px,2.4vw,26px)
        }

        input {
            font: inherit;
            font-size: 20px;
            padding: 14px 18px;
            border-radius: 16px;
            border: 3px solid #fff3;
            background: #0006;
            color: #fff;
            text-align: center;
            width: min(320px,90vw);
            outline: none
        }

            input:focus {
                border-color: var(--y)
            }

        button {
            font: inherit;
            cursor: pointer;
            color: #fff;
            border: 0
        }

        .big {
            font-size: clamp(20px,3vw,34px);
            font-weight: 900;
            padding: 16px 36px;
            border-radius: 999px;
            background: linear-gradient(135deg,var(--a),#ff7a2d);
            box-shadow: 0 8px 0 #7a0f3a,0 0 40px #ff2d7588;
            transition: transform .1s;
            animation: pulse 1.4s infinite
        }

            .big:active {
                transform: translateY(6px);
                box-shadow: 0 2px 0 #7a0f3a
            }

        .ghost {
            background: #fff2;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700
        }

            .ghost.on {
                background: var(--y);
                color: #000
            }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center
        }

        .em {
            font-size: 30px;
            background: #fff1;
            border-radius: 14px;
            width: 52px;
            height: 52px
        }

            .em.on {
                background: var(--y);
                transform: scale(1.2) rotate(-6deg)
            }

        .code {
            font-size: clamp(70px,16vw,200px);
            font-weight: 900;
            letter-spacing: .15em;
            color: var(--y);
            text-shadow: 0 0 40px #ffe60099;
            animation: float 3s ease-in-out infinite
        }

        .plist {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px
        }

        .chip {
            background: #fff2;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 20px;
            animation: pop .5s both
        }

        .duel {
            display: flex;
            gap: clamp(10px,3vw,40px);
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px
        }

        .av {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px
        }

            .av span {
                font-size: clamp(64px,12vw,160px);
                filter: drop-shadow(0 0 24px #fff6)
            }

            .av b {
                font-size: clamp(20px,3vw,40px)
            }

        .vs {
            font-size: clamp(50px,10vw,130px);
            font-weight: 900;
            color: var(--y);
            animation: slam .7s both;
            text-shadow: 0 0 30px #ffe600
        }

        .slideR {
            animation: inR .6s both
        }

        .slideL {
            animation: inL .6s both
        }

        .card {
            flex: 1;
            padding: 18px 10px;
            border-radius: 28px;
            border: 4px solid transparent;
            transition: .2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between
        }

        .ca {
            background: #ff2d7533;
            border-color: var(--a)
        }

        .cb {
            background: #00e5ff22;
            border-color: var(--b)
        }

        .card.pick {
            transform: scale(1.07);
            box-shadow: 0 0 60px currentColor;
            background: #fff3
        }

        .card.can {
            cursor: pointer
        }

        .fans {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: center;
            font-size: 28px;
            min-height: 36px
        }

            .fans i {
                font-style: normal;
                animation: pop .4s both
            }

        .cnt {
            font-size: 44px;
            font-weight: 900
        }

        .timer {
            width: min(600px,90vw);
            height: 14px;
            border-radius: 9px;
            background: #fff2;
            overflow: hidden
        }

            .timer i {
                display: block;
                height: 100%;
                background: linear-gradient(90deg,var(--a),var(--y));
                animation: shrink linear forwards;
                transform-origin: right
            }

        .tnum {
            font-size: clamp(40px,8vw,90px);
            font-weight: 900
        }

        .cd {
            font-size: clamp(90px,24vw,320px);
            font-weight: 900;
            color: var(--y);
            line-height: 1;
            text-shadow: 0 0 50px #ffe600
        }

            .cd.pop {
                animation: pop .4s
            }

        .tap {
            width: min(80vw,380px);
            height: min(80vw,380px);
            border-radius: 50%;
            font-size: 44px;
            font-weight: 900;
            background: radial-gradient(circle at 30% 30%,#ff7a2d,var(--a));
            box-shadow: 0 12px 0 #7a0f3a,0 0 60px #ff2d75aa;
            touch-action: manipulation
        }

            .tap:active {
                transform: translateY(8px) scale(.97);
                box-shadow: 0 4px 0 #7a0f3a
            }

            .tap.wait {
                background: radial-gradient(circle at 30% 30%,#ff6b6b,#b00020);
                animation: none
            }

            .tap.go {
                background: radial-gradient(circle at 30% 30%,#7dffb0,#00c853);
                box-shadow: 0 0 90px #00ff88
            }

        .opt {
            display: block;
            width: min(90vw,520px);
            margin: 8px auto;
            padding: 16px;
            border-radius: 18px;
            font-size: 22px;
            font-weight: 700;
            background: #fff2;
            border: 3px solid #fff3
        }

            .opt:active {
                background: var(--y);
                color: #000
            }

        .crown {
            font-size: 90px;
            animation: drop 1s both
        }

        .pen {
            background: #000a;
            border: 3px dashed var(--y);
            border-radius: 24px;
            padding: 18px 24px;
            max-width: 700px;
            font-size: clamp(20px,3.4vw,38px);
            font-weight: 900;
            animation: flip .8s both
        }

        .lose {
            animation: shake .6s .4s both
        }

        .rank {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff2;
            border-radius: 20px;
            padding: 10px 20px;
            width: min(640px,92vw);
            font-size: clamp(18px,3vw,30px);
            font-weight: 700;
            animation: inR .6s both
        }

            .rank:first-child {
                background: linear-gradient(90deg,#ffe60055,#ff2d7555);
                transform: scale(1.06)
            }

            .rank s {
                margin-inline-start: auto;
                text-decoration: none;
                color: var(--y);
                font-weight: 900
            }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--a);
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 700;
            z-index: 99;
            animation: pop .3s
        }

        .top {
            opacity: .7;
            font-weight: 700
        }

        #app {
            position: relative;
            z-index: 1
        }

        .rays {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 250vmax;
            height: 250vmax;
            margin: -125vmax 0 0 -125vmax;
            background: repeating-conic-gradient(#ffe60045 0 10deg,transparent 10deg 20deg);
            animation: spin 14s linear infinite;
            z-index: 0;
            pointer-events: none;
            -webkit-mask: radial-gradient(circle,#000 4%,transparent 38%);
            mask: radial-gradient(circle,#000 4%,transparent 38%)
        }

        .flash {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            animation: flash .9s .35s
        }

        .vwrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 6px solid var(--y);
            border-radius: 50%;
            opacity: 0;
            animation: ring 1.3s .4s both
        }

        .gray {
            filter: grayscale(1) brightness(.75)
        }

        .tug {
            width: min(900px,92vw);
            height: 22px;
            border-radius: 12px;
            background: var(--b);
            overflow: hidden;
            display: flex
        }

            .tug i {
                display: block;
                height: 100%;
                width: 50%;
                background: var(--a);
                transition: width .5s cubic-bezier(.3,1.6,.5,1)
            }

        .split {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw;
            width: 100%
        }

        .side {
            flex: 1;
            display: flex;
            justify-content: center;
            max-width: 42vw
        }

        .mid {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            z-index: 5
        }

        .split .cd {
            font-size: clamp(70px,12vw,200px)
        }

        .ph {
            width: 100%;
            min-height: 64vh;
            border: 10px solid #fff;
            border-radius: 44px;
            background: #000a;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px
        }

        .sa .ph {
            border-color: var(--a);
            box-shadow: 0 0 90px var(--a);
            transform: perspective(1300px) rotateY(14deg)
        }

        .sb .ph {
            border-color: var(--b);
            box-shadow: 0 0 90px var(--b);
            transform: perspective(1300px) rotateY(-14deg)
        }

        .mb {
            font-size: clamp(40px,6vw,90px);
            font-weight: 900;
            transition: transform .1s
        }

            .mb.g {
                color: #00ff88;
                text-shadow: 0 0 40px #0f8
            }

            .mb.x {
                color: #f44
            }

            .mb.w {
                opacity: .6
            }

        .mq {
            font-size: clamp(20px,2.6vw,38px);
            font-weight: 900
        }

        .dots {
            display: flex;
            gap: 8px
        }

            .dots i {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #fff3
            }

                .dots i.d {
                    background: var(--y);
                    animation: pop .4s
                }

        .how {
            background: #0008;
            border: 3px solid #fff3;
            border-radius: 28px;
            padding: 18px 28px;
            width: min(800px,92vw);
            min-height: 170px;
            animation: flip .6s both
        }

            .how b {
                font-size: clamp(22px,3.4vw,44px)
            }

        .pic {
            width: 100%;
            max-height: 44vh;
            object-fit: contain;
            border-radius: 18px;
            background: #fff
        }

        .blur {
            width: min(80vw,360px);
            height: 230px;
            object-fit: cover;
            border-radius: 18px;
            filter: blur(22px);
            animation: unblur 6s forwards
        }

        .memg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: min(80vw,340px);
            margin: 10px auto
        }

        .mem {
            height: min(34vw,140px);
            border-radius: 24px;
            opacity: .4;
            transition: transform .1s,opacity .1s
        }

            .mem.lit {
                opacity: 1;
                transform: scale(1.08);
                box-shadow: 0 0 40px #fff
            }

        @keyframes unblur {
            to {
                filter: blur(0)
            }
        }

        @keyframes flash {
            0% {
                opacity: .95
            }

            100% {
                opacity: 0
            }
        }

        @keyframes ring {
            0% {
                transform: scale(.2);
                opacity: 1
            }

            100% {
                transform: scale(10);
                opacity: 0
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes shine {
            to {
                background-position: 200%
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0)
            }

            70% {
                transform: scale(1.25)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.06)
            }
        }

        @keyframes float {
            50% {
                transform: translateY(-14px) rotate(1deg)
            }
        }

        @keyframes slam {
            0% {
                transform: scale(6) rotate(-20deg);
                opacity: 0
            }

            60% {
                transform: scale(.8)
            }

            100% {
                transform: scale(1) rotate(-4deg);
                opacity: 1
            }
        }

        @keyframes inR {
            from {
                transform: translateX(120vw)
            }

            to {
                transform: none
            }
        }

        @keyframes inL {
            from {
                transform: translateX(-120vw)
            }

            to {
                transform: none
            }
        }

        @keyframes shrink {
            to {
                transform: scaleX(0)
            }
        }

        @keyframes drop {
            0% {
                transform: translateY(-300px) rotate(-40deg);
                opacity: 0
            }

            70% {
                transform: translateY(10px)
            }

            100% {
                transform: none;
                opacity: 1
            }
        }

        @keyframes flip {
            from {
                transform: perspective(600px) rotateX(90deg);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes shake {
            20% {
                transform: translateX(-14px) rotate(-4deg)
            }

            40% {
                transform: translateX(14px) rotate(4deg)
            }

            60% {
                transform: translateX(-10px)
            }

            80% {
                transform: translateX(10px)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation-duration: .01s !important
            }
        }
    </style>
</head>
<body>

    <div id="app"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        /* ===== 1) הדביקו כאן את ההגדרות מ-Firebase Console ===== */
        const firebaseConfig = {
            apiKey: "AIzaSyBRl1u1Kr1KfGPnYJFzuD0obLJ_PFjTt5I",
            authDomain: "duel-game-fcc3f.firebaseapp.com",
            databaseURL: "https://duel-game-fcc3f-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "duel-game-fcc3f",
            storageBucket: "duel-game-fcc3f.firebasestorage.app",
            messagingSenderId: "233769513234",
            appId: "1:233769513234:web:3d8ef4a0a0cb797955c3cb",
            measurementId: "G-BCFC54NEEN"
        };
        const MIN_PLAYERS = 3; // לבדיקות. במסיבה אמיתית: 6
        const ENABLE_PHOTO = true; // false = מוציא את משחק התמונה הסודית (פרטיות)
        /* ======================================================= */

        const db = getDatabase(initializeApp(firebaseConfig));
        const $ = s => document.querySelector(s), app = $('#app');
        const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
        const sl = ms => new Promise(r => setTimeout(r, ms));
        const EM = ['😎', '🤡', '🔥', '👑', '🦄', '🐸', '🍕', '👽', '🥳', '🦁', '🐙', '💀'];
        const PEN = ['שתה לגימה (או מים, הבחירה שלך) 🥤', 'ספר בדיחה גרועה ותשאר רציני', '10 שכיבות סמיכה עכשיו 💪', 'דבר במבטא רוסי עד הסיבוב הבא', 'שיר פזמון ישראלי קלאסי בקול מלא 🎤', 'החבורה בוחרת לך כינוי ל-3 סיבובים', 'תחקה מורה מהתיכון', 'תרקוד 15 שניות בלי מוזיקה 🕺', 'תגיד "אחי" בכל משפט עד הסיבוב הבא', 'תשלח סטיקר מוזר לאחרון בצ׳אט האחרון שלך', 'תעשה קול של פרה בכל פעם שמישהו צוחק', 'תדבר רק בשאלות עד הסיבוב הבא'];
        const MILD = 'שתה כוס מים 💧 והמשך הלאה';

        /* ===== 2) מוזיקה וצלילים. מתנגנים רק במסך הטלוויזיה (המארח), לא בטלפונים =====
           שימו נתיב לקובץ בכל מקום, למשל 'audio/lobby.mp3'. ריק = שקט. (רק מוזיקה ללא זכויות יוצרים) */
        const AUDIO = {
            lobby: '',      // מוזיקת רקע בלובי בזמן שמחכים לשחקנים
            reveal: '',     // אפקט חשיפת הדו-קרב (VS)
            betting: '',    // מוזיקה בזמן ההימורים
            pop: '',        // צליל קצר כשמישהו מהמר
            countdown: '',  // ביפ בכל מספר של 3-2-1
            go: '',         // צליל GO
            play: '',       // מוזיקה בזמן המשחק הקטן
            tension: '',    // מוזיקת מתח ב-5 השניות האחרונות
            win: '',        // פאנפרה לניצחון
            lose: '',       // צליל מפסיד (למשל: וואה וואה)
            penalty: '',    // צליל כשהעונש נחשף
            final: ''       // מוזיקה למסך הסיום
        };
        const VOL = { music: .5, sfx: .9 };
        let cur = null, muted = false;
        function music(k) { if (!isHost) return; if (cur) { cur.pause(); cur = null } const s = AUDIO[k]; if (!s || muted) return; cur = new Audio(s); cur.loop = true; cur.volume = VOL.music; cur.play().catch(() => { }) }
        function sfx(k) { if (!isHost || muted || !AUDIO[k]) return; const a = new Audio(AUDIO[k]); a.volume = VOL.sfx; a.play().catch(() => { }) }

        /* הוראות שמסתובבות על הטלוויזיה בלובי. אפשר לערוך כאן */
        const HOWTO = [['📱', 'נכנסים מהטלפון', 'פותחים את האתר, מקלידים את קוד החדר ובוחרים כינוי ואימוג׳י'], ['⚔️', 'שני שחקנים נבחרים', 'בכל סיבוב מוגרלים שני מתחרים. הם משחקים בטלפון, ואתם רואים אותם על המסך'], ['💰', 'כולם מהמרים', 'בוחרים על מי שמים תוך 15 שניות. מי שלא בחר, המערכת בוחרת בשבילו'], ['💀', 'רק המפסיד נענש', 'מי שמפסיד בדו-קרב לוקח את העונש לבד. מי שהמר נכון רק צובר נקודות. תמיד אפשר ללחוץ פאס'], ['🏆', 'הכי הרבה נקודות מנצח', 'מנצח בדו-קרב 3 נק׳. הימור נכון 1 נק׳. הימור נכון על המיעוט 3 נק׳']];

        /* ===== מאגרי שאלות. כל שאלה: [טקסט, [4 תשובות], אינדקס התשובה הנכונה, תמונה (לא חובה)] ===== */
        // שאלות טריוויה מאתגרות עם 4 אפשרויות ואינדקסים מעורבבים (0 עד 3)
        const Q = [
            ['איזו מדינה מחזיקה בקו החוף הארוך ביותר בעולם?', ['קנדה', 'אוסטרליה', 'רוסיה', 'אינדונזיה'], 0], // תשובה 0
            ['מי היה הנשיא האמריקאי שסודיות רפואית הקיפה את מצבו הבריאותי בזמן מלחמת העולם השנייה?', ['וודרו ווילסון', 'הארי טרומן', 'דוויט אייזנהאואר', 'פרנקלין ד. רוזוולט'], 3], // תשובה 3
            ['איזה יסוד כימי נקרא על שם המילה הגרמנית ל"גובלין" או "שד"?', ['ניקל', 'ביסמוט', 'קובלט', 'טלוריום'], 2], // תשובה 2
            ['איזה מבין בעלי החיים הבאים הוא בעל הנשיכה החזקה ביותר יחסית למשקל גופו?', ['שד טסמני', 'היפופוטם', 'צבוע נקוד', 'אריה'], 0], // תשובה 0
            ['מהו המרחק האמיתי בקו אווירי בערך בין קייפ טאון בדרום אפריקה לקו המשווה?', ['כ-1,500 ק״מ', 'כ-7,500 ק״מ', 'כ-10,000 ק״מ', 'כ-4,000 ק״מ'], 3]  // תשובה 3
        ];

        // שאלות היגיון ומתמטיקה עם 4 אפשרויות (אינדקסים 0 עד 3)
        const QM = [
            ['רכבת נוסעת מנקודה A לנקודה B במהירות 60 קמ"ש, וחוזרת מיד בדרך חזרה במהירות 40 קמ"ש. מהי המהירות הממוצעת של כל הנסיעה הלוך ושוב?', ['50 קמ"ש', '45 קמ"ש', '52 קמ"ש', '48 קמ"ש'], 3], // תשובה 3
            ['אם 5 מכונות מייצרות 5 חלקים ב-5 דקות, כמה זמן ייקח ל-100 מכונות לייצר 100 חלקים?', ['5 דקות', '100 דקות', '20 דקות', '50 דקות'], 0], // תשובה 0
            ['בחבית יש כמות מים שמכפילה את נפחה בכל דקה. אם אחרי 60 דקות החבית מלאה עד ספה, באיזו דקה היא הייתה מלאה בדיוק חצי?', ['דקה 30', 'דקה 45', 'דקה 50', 'דקה 59'], 3], // תשובה 3
            ['במבחן יש 40 שאלות. על כל תשובה נכונה מקבלים 3 נקודות, ועל כל תשובה שגויה מורידים נקודה אחת. תלמיד ענה על כל 40 השאלות וקיבל ציון 80. כמה תשובות נכונות היו לו?', ['30', '25', '32', '28'], 0], // תשובה 0
            ['שני אבות ושני בנים הלכו לדוג, וכל אחד מהם תפס דג אחד בדיוק. בסך הכל היה להם שלל של 3 דגים בלבד. איך זה ייתכן?', ['אחד הדגים ברח בחזרה למים', 'שניים מהם דגו ביחד את אותו דג', 'הם היו סך הכל 3 אנשים: סב, אב ובן', 'אחד מהם איבד את הדג בדרך'], 2]  // תשובה 2
        ];

        const BANK = { trivia: Q, math: QM };
        const QH = ['מי בחדר הכי לא סביר שיחזור מעבודה ב-2 בלילה?', 'מי בחדר הכי יאחר לכל אירוע?', 'מי בחדר הכי ישרוד חודש בלי טלפון?', 'מי בחדר הכי יתחתן ראשון?', 'מי בחדר הכי יבכה בסרט?', 'מי בחדר הכי יברח ראשון מקרב?'];
        const tg = sd => 10 + sd % 21;
        /* עובדות למשחק אמת או שקר. [טקסט, 1 = אמת, 0 = שקר] */
        const FACTS = [
            // אמת (1) - נשמע כמו המצאה מוזרה
            ['הדבש לעולם אינו מתקלקל, ונמצאו צנצנות דבש בנות למעלה מ-3,000 שנה בקברים עתיקים במצרים שהיו אכילות לחלוטין', 1],

            ['השם המלא של העיר לוס אנג\'לס כולל עוד 13 מילים בסpanish, והשם המקורי שלה הוא "אל פואבלה דה נואסטרה סניורה לה ריינה דה לוס אנג\'לס"', 1],
            ['באיי שלמה שבאוקיינוס השקט יש אחוז ניכר של אנשים בעלי עור כהה שיש להם באופן טבעי שיער בלונדיני בהיר לחלוטין', 1],

            ['העיר ברלין בגרמניה נבנתה במקור סביב אגם ענק שיובש לחלוטין במאה ה-19 כדי להקים עליו את מרכז העיר', 0],
            ['השפה היחידה בעולם שאין בה זכר לזמנים (עבר, הווה, עתיד) היא השפה הפינית המדוברת', 0],
            ['חברת "קוקה קולה" קנתה בשנות ה-70 את כל המניות של חברת "פנטה" רק כדי לשנות את הטעם שלה למנדרינה', 0]
        ];
        const tfIdx = sd => { const i = sd % FACTS.length; let j = (sd * 7 + 3) % FACTS.length; if (j === i) j = (j + 1) % FACTS.length; return [i, j] };
        const tfRecap = (sd, A, B) => { const [i, j] = tfIdx(sd); return [[A, FACTS[i]], [B, FACTS[j]]].map(([p, f]) => `<p style="font-size:clamp(14px,2vw,22px)">${p ? esc(p.name) : ''} הקריא: ${esc(f[0])} ${f[1] ? '✅ אמת' : '❌ שקר'}</p>`).join('') };
        const SF = n => n == null ? 'לא עצר' : (n / 1000).toFixed(2) + ' שנ׳';
        const head = g => { const t = { exact: 'לחצו בדיוק ' + tg(g.seed) + ' פעמים', stop: 'עצרו בדיוק על 5.00', honest: QH[g.seed % QH.length], tf: 'מקריאים עובדה. היריב מנחש אמת או שקר' }[g.id]; return t ? `<h2>${t}</h2>` : '' };

        const GAMES = {

            trivia: { early: 1, n: '🇮🇱 טריוויה ישראלית', r: 'ענו נכון על כמה שיותר שאלות', dur: 20000, hi: 1, f: n => n + ' נכון' },
            exact: { n: '🔢 לחיצה מדויקת', r: 'לחצו בדיוק את המספר הנדרש. אחת יותר = פסול', dur: 6000, hi: 0, end: t => t, cmp: (t, g) => { const N = tg(g.seed); return t > N ? 100 + t - N : N - t }, f: (n, g) => n == null ? 'לא לחץ' : n + ' לחיצות מתוך ' + tg(g.seed) + (n > tg(g.seed) ? ' ❌ חרג' : '') },

            math: { early: 1, n: '🧮 חשבון על הרגל', r: 'חידות חשבון מהירות. מי צודק ביותר מנצח', dur: 25000, hi: 1, f: n => n + ' נכון' },
            honest: { n: '🕵️ מי הכי...', r: 'בחרו את התשובה שהחדר יבחר. הקהל בוחר איתכם', dur: 15000, hi: 1, pick: 1, f: n => n + ' מהחדר' },
            still: { n: '🧘 אל תזיז את הטלפון', r: 'החזיקו את הטלפון בלי לזוז. הקהל מנסה להצחיק אתכם', dur: 15000, hi: 0, end: t => t, f: n => n + ' תזוזות' },

            memory: { early: 1, n: '🧠 משחק זיכרון', r: 'צפו ברצף הצבעים וחזרו עליו. בכל שלב הרצף מתארך', dur: 40000, hi: 1, f: n => n + ' שלבים' },
            tf: { early: 1, n: '🎭 אמת או שקר', r: 'כל אחד מקריא עובדה (אמת מוזרה או שקר מטורף) והיריב מנחש. הקהל מהמר מי ינצח', dur: 50000, hi: 1, end: () => 0, f: n => n >= 1 ? '✅ צדק' : '❌ טעה' }
        };

        /* מראה של הטלפון של המתחרה על הטלוויזיה */
        function mirror(id) {
            const p = (room.players || {})[id], l = (liveD || {})[id] || {}, G = room.game.id, bk = BANK[G], T = (c, t) => `<div class="mb ${c}">${t}</div>`; let x = '';
            if (G === 'tap') x = `<div class="mb" style="transform:scale(${1 + Math.min(l.t || 0, 60) / 60 * .6})">👆<br>${l.t || 0}</div>`;
            else if (G === 'exact') x = T('w', '🤫<br>לוחץ...');
            else if (G === 'react') x = T(l.s === 'go' ? 'g' : l.s === 'early' ? 'x' : 'w', l.s === 'go' ? 'עכשיו!!!' : l.s === 'early' ? '💥 מוקדם מדי' : l.s === 'done' ? l.v + ' מ״ש' : 'חכו...');
            else if (GAMES[G].tgt) x = l.s === 'done' ? T('g', (l.v / 1000).toFixed(2)) : T('tm', '0.00');
            else if (bk) { const i = l.i || 0; x = `<div class="mq">${i >= bk.length ? 'סיים! ✅' : bk[i][0]}</div><div class="dots">${bk.map((_, k) => `<i class="${k < i ? 'd' : ''}"></i>`).join('')}</div>` }
            else if (G === 'still') x = T('', '📵 תזוזות: ' + (l.m || 0));
            else if (G === 'honest') x = T('', l.s === 'done' ? '🔒 ננעל' : '🤔 חושב...');
            else if (G === 'memory') x = T('', '🧠<br>שלבים: ' + (l.l || 0));
            else if (G === 'tf') { const rd = (now() - room.game.startAt < GAMES.tf.dur / 2 && (room.res || {})[room.duel.b] == null) ? room.duel.a : room.duel.b; x = T(id === rd ? 'g' : 'w', id === rd ? '📢<br>מקריא...' : (l.s === 'done' ? '🔒 ענה' : '🤔<br>מנחש...')) }
            else if (G === 'draw') x = T('', l.s === 'done' ? '🎨 סיים' : '🎨 מצייר...');

        }

        let code, pid, isHost = false, room = {}, off = 0, last = '', timers = [], liveD = {}, running = false;

        const MD = (p = '') => ref(db, 'media/' + code + (p ? '/' + p : '')); // תמונות וציורים, נמחקים מיד אחרי ההצבעה
        const P = () => Object.entries(room.players || {}).filter(([, v]) => v && v.name).map(([id, v]) => ({ id, ...v }));
        const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2500) };
        const vib = p => navigator.vibrate && navigator.vibrate(p);
        const av = (p, c = '') => p ? `<div class="av ${c}"><span>${p.emoji}</span><b>${esc(p.name)}</b></div>` : '';

        function boom(n = 140) {
            const c = $('#cv'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
            const ps = [...Array(n)].map(() => ({ x: c.width / 2, y: c.height * .65, vx: (Math.random() - .5) * 20, vy: -Math.random() * 20 - 6, s: Math.random() * 9 + 5, r: Math.random() * 6, c: `hsl(${Math.random() * 360},100%,60%)` }));
            (function f() { x.clearRect(0, 0, c.width, c.height); let alive = 0; ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.r += .2; if (p.y < c.height + 30) alive = 1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); x.restore() }); alive ? requestAnimationFrame(f) : x.clearRect(0, 0, c.width, c.height) })()
        }

        /* ---------- דף הבית ---------- */
        function home() {
            let em = EM[0];
            app.innerHTML = `<h1 class="logo">דו־קרב</h1><p>שני שחקנים. כולם מהמרים. מי שמפסיד נענש.</p>

        function listen() {

              <button class="ghost" id="hm2">🏠 דף הבית (החדר נשאר פתוח)</button><button class="ghost" id="cl" style="background:#a0123a">🛑 סגור חדר ומחק הכול</button><button class="ghost" id="x">סגור תפריט</button></div>`;
                const re = () => setTimeout(() => { if ($('#pnl')) draw() }, 350);

            };
            draw()
        }
        function render() { const k = room.phase + '|' + room.round + '|' + (isHost || !!((room.players || {})[pid] && room.players[pid].name)); if (k !== last) { last = k; timers.forEach(clearInterval); timers = []; screen() } else live() }

        /* ---------- עדכונים חיים ---------- */
        function live() {
            const ps = P();
            if (room.phase === 'result') {

                }
                else if (g.id === 'photo') {
                    st.innerHTML = '<p>⚠️ התמונה תוצג לכולם ותימחק מיד אחרי ההצבעה</p><label class="big" style="display:inline-block">📷 בחרו תמונה<input id="fi" type="file" accept="image/*" hidden></label>';
                    $('#fi').onchange = e => { const f = e.target.files[0]; if (!f || sent) return; const im = new Image(); im.onload = () => { const k = Math.min(1, 320 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); saveImg(c.toDataURL('image/jpeg', .6)); lv({ s: 'done' }, 1); send(1); st.innerHTML = '<p>✅ נשלח! עכשיו מחכים לקהל</p>' }; im.src = URL.createObjectURL(f) }
                }
            };
            const tick = setInterval(() => {
                const l = g.startAt - now();
                if (l > 0) { const n = Math.ceil(l / 1000); if (big.textContent != n) { big.textContent = n; big.className = 'cd pop'; vib(30); sfx('countdown') } return }
                if (!started) { started = 1; big.textContent = 'GO!'; big.className = 'cd pop'; sfx('go'); if (duelist && g.id !== 'still') vib([150, 60, 300]); begin() }
                const left = Math.ceil((g.endAt - now()) / 1000);
                if (now() > g.startAt + 700 && left >= 0) big.textContent = left;
                if (left === 5 && !tn) { tn = 1; music('tension') }
                if (frame) frame();
                if (isHost && G.tgt) { const t = ((now() - g.startAt) / 1000).toFixed(2); document.querySelectorAll('.tm').forEach(e => e.textContent = t) }
                if (now() >= g.endAt && !over) {
                    over = 1; clearInterval(tick); big.textContent = '⏱️'; if (g.id === 'tap') lv({ t: taps }, 1); if (g.id === 'still') lv({ m: taps }, 1);
                    if (duelist) { if (clean) clean(); { const v = G.end ? G.end(taps, g) : G.hi ? taps : 9999; if (v != null) send(v) } }
                }
            }, 80); timers.push(tick);
        }

        /* ---------- ניהול המשחק (רץ רק אצל המארח) ---------- */
        async function runMatch(from = 1) {
            if (running) return; running = true;
            let lastGid = '', lastD = room.duel ? [room.duel.a, room.duel.b] : [], r = from, cancels = 0;
            while (r <= room.total) {
                if (!room.phase) break;
                let ps = P().filter(p => p.on !== false); if (ps.length < 2) ps = P();
                if (ps.length < 2) { await update(RR(), { phase: 'lobby' }); toast('אין מספיק שחקנים. חוזרים ללובי'); running = false; return }
                ps.sort(() => Math.random() - .5);
                let pool = ps.filter(p => !lastD.includes(p.id)); if (pool.length < 2) pool = ps;
                pool.sort((x, y) => (x.duels || 0) - (y.duels || 0));
                const a = pool[0], b = pool[1]; lastD = [a.id, b.id];
                const ids = Object.keys(GAMES).filter(k => k !== lastGid && (ENABLE_PHOTO || k !== 'photo')), gid = ids[Math.random() * ids.length | 0]; lastGid = gid; const G = GAMES[gid];
                const d0 = { [a.id]: a.duels || 0, [b.id]: b.duels || 0 };
                // מתחרה שיצא מהחדר מבטל את הסיבוב מיד. ניתוק חיבור מבטל רק אחרי 8 שניות, כדי שמעבר רגעי לגלריה לא יפסול סיבוב
                const offAt = {}, gone = () => {
                    const pl = room.players || {};
                    return [a.id, b.id].some(i => { const p = pl[i]; if (!p || !p.name) return true; if (p.on === false) { offAt[i] = offAt[i] || Date.now(); return Date.now() - offAt[i] > 8000 } offAt[i] = 0; return false })
                };
                const chk = async ms => { const e = Date.now() + ms; while (Date.now() < e) { if (!room.phase || gone()) throw 'cancel'; await sl(Math.min(400, e - Date.now())) } if (!room.phase || gone()) throw 'cancel' };
                try {
                    await Promise.all([remove(LV()), remove(MD())]);
                    await update(RR(), {
                        phase: 'reveal', round: r, duel: { a: a.id, b: b.id }, game: { id: gid, seed: Math.random() * 1e6 | 0 }, bets: null, res: null, result: null, votes: null, pick: null, cancel: null, next: null, nextGo: null,
                        ['players/' + a.id + '/duels']: (a.duels || 0) + 1, ['players/' + b.id + '/duels']: (b.duels || 0) + 1
                    });
                    await chk(5000);
                    if (!G.nobet) {
                        await update(RR(), { phase: 'betting', betEnd: now() + 15000 });
                        await chk(15600);
                        // הימור אוטומטי רק למחוברים שלא הימרו. קוראים מצב טרי, וכל הימור נכתב בטרנזקציה כך שהימור אנושי ברגע האחרון אף פעם לא נדרס
                        const fresh = (await get(RR())).val() || {}; if (!fresh.phase) throw 'cancel'; room = fresh;
                        const bets = { ...(fresh.bets || {}) }, todo = [];
                        P().filter(p => p.id !== a.id && p.id !== b.id && p.on !== false && !bets[p.id]).forEach(p => { const ca = Object.values(bets).filter(x => x === 'a').length, cb = Object.values(bets).filter(x => x === 'b').length; const sd = ca < cb ? 'a' : cb < ca ? 'b' : (Math.random() < .5 ? 'a' : 'b'); bets[p.id] = sd; todo.push([p.id, sd]) });
                        await Promise.all(todo.map(([id, sd]) => runTransaction(RR('bets/' + id), cur => cur == null ? sd : undefined)));
                    }
                    const startAt = now() + 4000;
                    await update(RR(), { phase: 'play', game: { id: gid, seed: room.game.seed, startAt, endAt: startAt + G.dur } });
                    if (G.early) {
                        // משחקים שנגמרים כששני המתחרים סיימו: לא מחכים לסוף הזמן
                        const e = Date.now() + G.dur + 4000 + 2500;
                        while (Date.now() < e) { await chk(400); const rs = room.res || {}; if (rs[a.id] != null && rs[b.id] != null) break }
                        await chk(1500)
                    } else await chk(G.dur + 4000 + 2500);
                    if (G.vote) { await update(RR(), { phase: 'vote', voteEnd: now() + 12000 }); await chk(12800) }
                    await finish(a.id, b.id, G);
                } catch (e) {
                    if (e !== 'cancel') throw e;
                    const f = (await get(RR())).val(); if (!f || !f.phase) { running = false; return }
                    room = f; const pl = f.players || {};
                    const names = [a, b].filter(p => { const q = pl[p.id]; return !q || !q.name || q.on === false }).map(p => p.emoji + ' ' + p.name);
                    const up = { phase: 'cancel', cancel: names.join(' · '), bets: null, res: null, votes: null, pick: null, result: null };
                    [a, b].forEach(p => { if (pl[p.id] && pl[p.id].name) up['players/' + p.id + '/duels'] = d0[p.id] });
                    await update(RR(), up); remove(LV()); remove(MD());
                    await sl(4500); if (++cancels > 10) break;
                    continue
                }
                // בין סיבוב לסיבוב מחכים עד שהמארח לוחץ "סיבוב הבא" או שרוב השחקנים המחוברים לחצו "מוכנים". גג של 5 דקות
                await sl(1500);
                for (const end = Date.now() + 300000; ;) {
                    await sl(400); if (!room.phase) break;
                    const on = P().filter(p => p.on !== false), n = on.filter(p => (room.next || {})[p.id]).length;
                    if (room.nextGo || (on.length && n > on.length / 2) || Date.now() > end) break
                }
                r++;
            }
            await Promise.all([remove(LV()), remove(MD())]);
            if (!room.phase) { running = false; return }
            await update(RR(), { phase: 'final' }); running = false;
        }

        async function finish(a, b, G) {
            { const f = (await get(RR())).val(); if (f && f.phase) room = f }
            const res = room.res || {}, pl = Object.fromEntries(Object.entries(room.players || {}).filter(([, v]) => v && v.name)), bets = room.bets || {}, w0 = G.hi ? 0 : 9999;
            let sa, sb; const cn = (o, v) => Object.values(o || {}).filter(x => x === v).length;
            if (G.vote) { sa = cn(room.votes, 'a'); sb = cn(room.votes, 'b') }
            else if (G.pick) { sa = cn(room.pick, res[a]); sb = cn(room.pick, res[b]) }
            else { sa = res[a] ?? (G.cmp ? null : w0); sb = res[b] ?? (G.cmp ? null : w0) }
            const kf = v => G.cmp ? (v == null ? -1e9 : -G.cmp(v, room.game)) : v, ka = kf(sa), kb = kf(sb), upw = G.hi || G.cmp;
            let win = upw ? (ka > kb ? 'a' : ka < kb ? 'b' : null) : (ka < kb ? 'a' : ka > kb ? 'b' : null); const tie = !win; if (tie) win = Math.random() < .5 ? 'a' : 'b';
            const W = win === 'a' ? a : b, L = win === 'a' ? b : a, lose = win === 'a' ? 'b' : 'a';
            const voters = Object.keys(pl).filter(i => i !== a && i !== b && (pl[i].on !== false || bets[i]));
            const fw = G.nobet ? [] : voters.filter(i => bets[i] === win);
            const min = !G.nobet && voters.length > 0 && fw.length / voters.length < .35;
            const sc = {}, pn = {}; Object.keys(pl).forEach(i => { sc[i] = pl[i].score || 0; pn[i] = pl[i].pen || 0 });
            if (W in sc) sc[W] += 3; fw.forEach(i => sc[i] += min ? 3 : 1);
            const losers = [L]; losers.forEach(i => { if (i in pn) pn[i]++ });
            const up = { phase: 'result', next: null, nextGo: null, result: { win, tie, sa, sb, min, losers, pen: PEN[Math.random() * PEN.length | 0] } };
            Object.keys(sc).forEach(i => { up['players/' + i + '/score'] = sc[i]; up['players/' + i + '/pen'] = pn[i] });
            await update(RR(), up);
            remove(MD()); remove(LV());
        }

        async function resume() {
            try {
                const x = JSON.parse(localStorage.getItem('duel_s') || 'null');
                if (x) {
                    const rs = await get(ref(db, 'rooms/' + x.code)); const v = rs.val();
                    if (v && (x.host || (v.players && v.players[x.pid] && v.players[x.pid].name))) {
                        code = x.code; isHost = !!x.host; pid = x.pid; room = v; listen();
                        if (isHost && v.phase && v.phase !== 'lobby' && v.phase !== 'final') { toast('המארח התחבר מחדש. ממשיכים מהסיבוב הבא'); setTimeout(() => runMatch((v.round || 0) + 1), 3000) }
                        return
                    }
                }
            } catch (e) { }
            localStorage.removeItem('duel_s'); home()
        }
        resume();
    </script>
